# Builds a release when a tag like v0.1.4 is pushed: the .NET tool package for nuget.org and a self-contained
# clikclok.exe per Windows architecture (zipped, for winget and direct download), attached to a GitHub release.
# Secrets: CLIKCLOK_CLIENT_KEY and CLIKCLOK_CLIENT_SECRET (embedded by the build). nuget.org uses Trusted Publishing:
# a policy on nuget.org for repository Matt-17/ClikClok, workflow release.yml, environment NuGet, and the repository
# variable NUGET_USER (the nuget.org user that owns the policy).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the GitHub release
  id-token: write # nuget.org Trusted Publishing

jobs:
  release:
    runs-on: windows-latest
    environment: NuGet
    env:
      CLIKCLOK_CLIENT_KEY: ${{ secrets.CLIKCLOK_CLIENT_KEY }}
      CLIKCLOK_CLIENT_SECRET: ${{ secrets.CLIKCLOK_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check version matches tag
        shell: pwsh
        run: |
          $version = ([xml](Get-Content src/ClikClok/ClikClok.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match project version $version" }
          if (-not $env:CLIKCLOK_CLIENT_KEY -or -not $env:CLIKCLOK_CLIENT_SECRET) { throw "CLIKCLOK_CLIENT_* secrets are missing" }

      - name: Pack .NET tool
        run: dotnet pack src/ClikClok -c Release -o out

      - name: Publish Windows executables
        shell: pwsh
        run: |
          foreach ($rid in "win-x64", "win-arm64") {
            dotnet publish src/ClikClok -c Release -r $rid --self-contained -p:PackAsTool=false `
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o "publish/$rid"
            Move-Item "publish/$rid/ClikClok.exe" "publish/$rid/clikclok.exe" -Force
            Compress-Archive -Path "publish/$rid/clikclok.exe" -DestinationPath "out/clikclok-$rid.zip"
          }
          Get-FileHash out/*.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } |
            Set-Content out/SHA256SUMS.txt

      - name: NuGet login
        id: login
        uses: NuGet/login@v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        shell: pwsh
        run: |
          $packages = Get-ChildItem out -Filter *.nupkg
          if (-not $packages) { Get-ChildItem out; throw "No .nupkg in out" }
          foreach ($package in $packages) {
            dotnet nuget push $package.FullName --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" `
              --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create "${{ github.ref_name }}" (Get-ChildItem out -File).FullName --title "ClikClok ${{ github.ref_name }}" --generate-notes
